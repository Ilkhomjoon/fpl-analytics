name: Sinovlar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit testlar
        run: python -m pytest tests/ -q
      - name: Model kalibrovkasi
        run: python tools/calibrate.py
      - name: Demo hisobot (tarmoqsiz)
        run: python run.py --demo --dry-run --mode deadline
